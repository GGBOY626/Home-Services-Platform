worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        client_max_body_size 20M;

        # X-Request-Id pass-through (use custom var; $request_id is nginx built-in)
        set $req_id $http_x_request_id;
        if ($req_id = "") {
            set $req_id $request_id;
        }
        add_header X-Request-Id $req_id;

        # API proxy
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
        }

        # Files (uploads) proxy to backend
        location /files/ {
            proxy_pass http://backend/files/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User app
        location /user/ {
            alias /usr/share/nginx/html/user/;
            try_files $uri $uri/ /user/index.html;
        }
        location = /user {
            return 301 /user/;
        }

        # Worker app
        location /worker/ {
            alias /usr/share/nginx/html/worker/;
            try_files $uri $uri/ /worker/index.html;
        }
        location = /worker {
            return 301 /worker/;
        }

        # Merchant app
        location /merchant/ {
            alias /usr/share/nginx/html/merchant/;
            try_files $uri $uri/ /merchant/index.html;
        }
        location = /merchant {
            return 301 /merchant/;
        }

        # Admin app
        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            try_files $uri $uri/ /admin/index.html;
        }
        location = /admin {
            return 301 /admin/;
        }

        # Root redirect to user app
        location = / {
            return 301 /user/;
        }
    }
}

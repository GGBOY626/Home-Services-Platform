services:
  mysql:
    image: mysql:8.0
    container_name: home-services-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: home-services-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/data/uploads}
      APP_STORAGE_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      USER_FRONTEND_URL: ${USER_FRONTEND_URL:-http://zhengwei.tech:8088/user}
      MERCHANT_FRONTEND_URL: ${MERCHANT_FRONTEND_URL:-http://zhengwei.tech:8088/merchant}
      WORKER_FRONTEND_URL: ${WORKER_FRONTEND_URL:-http://zhengwei.tech:8088/worker}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
    container_name: home-services-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8088}:80"
    depends_on:
      - backend
    networks:
      - app

volumes:
  mysql_data:
  uploads_data:

networks:
  app:
    driver: bridge

spring:
  application:
    name: home-services-platform
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.homeservices: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

app:
  cors:
    allowed-origins: ""
  jwt:
    access-token-validity-ms: 900000
    refresh-token-validity-days: 7
    secret: "HomeServicesPlatformJwtSecretKeyForSigningAccessAndRefreshTokensMinimum256Bits"
  dispatch:
    merchant-assign-ttl-minutes: 10
    worker-accept-ttl-minutes: 5
  scheduling:
    min-hours-ahead: 1
    max-days-ahead: 60
  storage:
    local-root: "./uploads"
    public-base-url: "http://localhost:8080"
    max-file-size-mb: 10
    max-files-per-proof: 6
    allowed-content-types: ["image/jpeg","image/png","image/webp"]
  stripe:
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

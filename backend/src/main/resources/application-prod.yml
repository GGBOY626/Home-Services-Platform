spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/home_services?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: framework
app:
  jwt:
    secret: ${APP_JWT_SECRET}
  storage:
    local-root: ${APP_STORAGE_LOCAL_ROOT:/data/uploads}
    public-base-url: ${APP_STORAGE_PUBLIC_BASE_URL:http://localhost:8088}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8088}

logging:
  level:
    com.homeservices: INFO
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF